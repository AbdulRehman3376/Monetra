<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="description" content="MONETRA is a simple money planner that helps students plan and track their food budget.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MONETRA">
  <meta name="format-detection" content="telephone=no">
  <title>MONETRA</title>
  <link rel="icon" type="image/svg+xml" href="./monetra-logo.svg">
  <link rel="stylesheet" href="./styles.css?v=23">
  <script src="./native-plugins.js?v=2" defer></script>
<script src="./app.js?v=12" defer></script>
  <script src="./excel.js?v=1" defer></script>
  <script src="./budget.js?v=47"  defer></script>
  <script src="./udhaar.js?v=15" defer></script>
  <script src="./group.js?v=9" defer></script>
  <script src="./timemachine.js?v=5" defer></script>
  <script src="./fit.js?v=2" defer></script>
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12v4"/><path d="M4 7v10a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"/><circle cx="16" cy="14" r="1.2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 5v4h4M4 13a8 8 0 0 0 14 4M20 19v-4h-4"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="m7 15 4-5 3 3 5-7"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.4.2 4 1.8 4 4.3"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <!-- Launch screen -->
    <div class="splash" id="splash" role="status" aria-label="Loading MONETRA">
      <img src="./monetra-logo.svg" alt="" width="84" height="84">
      <div class="splash-name">MONETRA</div>
      <p>Know your money. Spend smart.</p>
      <span class="splash-bar" aria-hidden="true"></span>
    </div>

    <main class="screens" id="screens">
      <!-- HOME -->
      <section class="screen is-active" data-screen="home" aria-label="Home">
        <div class="scroll flush" id="homeRoot"></div>
      </section>

      <!-- BUDGET -->
      <section class="screen" data-screen="budget" aria-label="Budget">
        <div class="scroll" id="budgetRoot"></div>
      </section>

      <!-- LEND & BORROW (people ledger, kept separate from the budget) -->
      <section class="screen" data-screen="udhaar" aria-label="Lend and borrow ledger">
        <div class="scroll" id="udhaarRoot"></div>
      </section>

      <!-- DIARY -->
      <section class="screen" data-screen="diary" aria-label="Spending diary">
        <div class="scroll" id="diaryRoot"></div>
      </section>

    </main>

    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab" type="button" data-action="go" data-to="home" aria-current="page"><span class="ico"><svg class="i"><use href="#i-home"/></svg></span>Home</button>
      <button class="tab" type="button" data-action="go" data-to="budget"><span class="ico"><svg class="i"><use href="#i-wallet"/></svg></span>Budget</button>
      <button class="tab" type="button" data-action="go" data-to="diary"><span class="ico"><svg class="i"><use href="#i-calendar"/></svg></span>Diary</button>
      <button class="tab" type="button" data-action="go" data-to="udhaar"><span class="ico"><svg class="i"><use href="#i-users"/></svg></span>Loans</button>
    </nav>

    <!-- Bottom sheet -->
    <div class="sheet-root" id="sheetRoot" hidden>
      <div class="sheet-overlay" data-action="sheet-close"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="grab" aria-hidden="true"></div>
        <div id="sheetBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
